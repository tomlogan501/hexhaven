<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- maximum-scale/user-scalable keep the page itself from zooming so two
     fingers always pinch the BOARD, not the browser. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Hex Haven</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <h1>Hex Haven</h1>
    <div id="status" data-i18n="status_loading">Generating the island…</div>
    <div id="turninfo"></div>
    <button class="btn ghost" id="btn-log" data-i18n="btn_log">Log</button>
  </header>

  <!-- The board owns the screen. HUD panels float above it,
       so no fixed-width sidebar steals width from the board. -->
  <main id="stage">
    <canvas id="board"></canvas>

    <section class="hud" id="hud-players">
      <h3 data-i18n="panel_players">Players</h3>
      <div id="players"></div>
      <p class="hint" id="boardinfo"></p>
    </section>

    <section class="hud" id="hud-log">
      <h3 data-i18n="panel_log">Log</h3>
      <div id="log"></div>
    </section>

    <!-- Compact bottom bar: resources, then build tools + dice on ONE row,
         a single hint line, and secondary options tucked into a gear menu.
         Empty containers must not reserve space. -->
    <!-- Player resources float bottom-left as their own small panel,
         separate from the action bar. -->
    <section class="hud" id="hud-res">
      <div id="hand" class="chips"></div>
    </section>

    <section class="hud" id="hud-hand">
      <div class="handbar">
        <div class="chips" id="buildbar">
          <button class="btn" id="build-settlement" data-build="settlement" data-i18n="btn_settlement">Settlement</button>
          <button class="btn" id="build-road" data-build="road" data-i18n="btn_road">Road</button>
          <button class="btn" id="build-city" data-build="city" data-i18n="btn_city">City</button>
          <button class="btn" id="btn-dev" data-i18n="btn_dev">Dev card</button>
        </div>
        <div class="chips">
          <button class="btn primary" id="btn-roll" data-i18n="btn_roll">Roll dice</button>
          <button class="btn" id="btn-trade" data-i18n="btn_trade">Trade</button>
          <button class="btn" id="btn-pass" data-i18n="btn_pass">End turn</button>
        </div>
        <div class="chips" id="devcards"></div>
      </div>
      <div class="hintline">
        <p class="hint" id="rollresult" data-i18n="h_roll_begin">Click Roll to begin.</p>
        <p class="hint" id="buildhint" data-i18n="h_picktool">Pick a build tool, then click a highlighted spot.</p>
      </div>
      <div id="discardpanel" class="hidden">
        <p class="hint warn" id="discarthint"></p>
      </div>
      <!-- Player-to-player trade panel, shown centred over the board while
           an offer is being composed. -->
      <section class="hud hidden" id="tradepanel">
        <div class="chips tptabs">
          <button class="btn ghost active" id="tab-players" data-i18n="tp_tab_players">Players</button>
          <button class="btn ghost" id="tab-bank" data-i18n="tp_tab_bank">Bank &amp; harbors</button>
        </div>
        <h3 id="trade-title">Trade with players</h3>
        <p class="hint" id="tradehint">Click chips to set quantities.</p>
        <div class="traderow"><span class="tradelabel" data-i18n="tp_give">You give</span>
          <div id="trade-give" class="chips"></div>
        </div>
        <div class="traderow"><span class="tradelabel" data-i18n="tp_get">You get</span>
          <div id="trade-want" class="chips"></div>
        </div>
        <div class="chips">
          <button class="btn primary" id="btn-offer" data-i18n="tp_offer">Offer</button>
          <button class="btn" id="btn-trade-clear" data-i18n="tp_clear">Clear</button>
          <button class="btn" id="btn-trade-close" data-i18n="tp_close">Close</button>
        </div>
      </section>

      <!-- Options live in the overlay menu opened by the floating gear. -->
    </section>

    <!-- Zoom controls ride the right edge, clear of the log (top) and the
         hand (bottom), and work in portrait as well as landscape. -->
    <section class="hud" id="camcontrols">
      <button class="btn" id="btn-zoom-in" title="Zoom in">+</button>
      <button class="btn" id="btn-zoom-out" title="Zoom out">&minus;</button>
      <button class="btn" id="btn-zoom-fit" title="Recentrer le plateau">&#x2922;</button>
    </section>

    <!-- Options gear floats on its own at the bottom-right corner, clear of
         the action bar; it opens the overlay menu below. -->
    <section class="hud" id="hud-gear">
      <button class="btn gear" id="btn-menu" title="Options">&#9881;</button>
    </section>

    <!-- Resource graph (debug runs): a collapsible window over the board
         showing, per resource (or the hand total), every player's stock
         turn by turn. -->
    <section class="hud hidden" id="hud-graph">
      <div class="graphtop">
        <h3 data-i18n="graph_title">Resources over turns</h3>
        <select id="graph-res" title="Resource">
          <option value="" selected data-i18n="graph_total">Total</option>
          <option value="forest" data-i18n="res_forest">Wood</option>
          <option value="pasture" data-i18n="res_pasture">Sheep</option>
          <option value="field" data-i18n="res_field">Grain</option>
          <option value="hill" data-i18n="res_hill">Brick</option>
          <option value="mount" data-i18n="res_mount">Ore</option>
        </select>
        <button class="btn ghost" id="btn-graph-min" data-i18n-title="graph_min" title="Collapse">&#9662;</button>
        <button class="btn ghost" id="btn-graph-hide" data-i18n-title="graph_hide" title="Hide">&#10005;</button>
      </div>
      <canvas id="resgraph"></canvas>
    </section>

    <!-- Principal menu: a centred card over a dimmed backdrop, shown at
         boot and reopened with the floating gear. Title, play, rules &
         objectives, language and options in one place. -->
    <div id="optoverlay" class="open">
      <div id="optmenu" role="dialog" aria-label="Main menu">
        <div class="opttop">
          <h2 class="mtitle"><span>Hex</span> Haven</h2>
          <button class="btn ghost" id="btn-opt-close" title="Close">&#10005;</button>
        </div>
        <button class="btn primary big" id="btn-play" data-i18n="m_play">Play</button>
        <button class="btn big" id="btn-rules" data-i18n="m_rules">Rules &amp; objectives</button>
        <label class="optrow"><span data-i18n="m_lang">Language</span>
          <select id="lang">
            <option value="en" selected>English</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
            <option value="de">Deutsch</option>
          </select>
        </label>
        <div class="msep" data-i18n-title="m_lang"></div>
        <button class="btn ghost" id="btn-music">Music: off</button>
        <button class="btn ghost" id="btn-sfx">SFX: on</button>
        <label class="optrow"><span data-i18n="vol">Volume</span>
          <input type="range" id="volume" min="0" max="100" value="70">
        </label>
        <label class="optrow"><span data-i18n="ai_opponents">AI opponents</span>
          <select id="opponent-count">
            <option value="1">1</option>
            <option value="2" selected>2</option>
            <option value="3">3</option>
          </select>
        </label>
        <label class="optrow"><span data-i18n="island_size">Island size</span>
          <select id="island-size">
            <option value="standard" selected>Standard</option>
            <option value="xl" data-i18n="island_xl">XL (double tiles)</option>
          </select>
        </label>
        <button class="btn ghost" id="btn-new" data-i18n="btn_new">New game</button>
        <button class="btn ghost" id="btn-debug">Debug: auto-play</button>
      </div>
    </div>

    <!-- Rules & objectives panel: same overlay pattern as the menu. -->
    <div id="rulesoverlay">
      <div id="rulespanel" role="dialog" aria-label="Rules">
        <div class="opttop">
          <h3 data-i18n="rules_title">Rules &amp; objectives</h3>
          <button class="btn ghost" id="btn-rules-close" title="Close">&#10005;</button>
        </div>
        <ul class="ruleslist">
          <li data-i18n="r_goal"></li>
          <li data-i18n="r_vp"></li>
          <li data-i18n="r_turn"></li>
          <li data-i18n="r_seven"></li>
          <li data-i18n="r_build"></li>
          <li data-i18n="r_harbor"></li>
          <li data-i18n="r_dev"></li>
          <li data-i18n="r_trade"></li>
          <li data-i18n="r_end"></li>
        </ul>
        <button class="btn primary" id="btn-rules-ok" data-i18n="rules_close">Close</button>
      </div>
    </div>
  </main>
</div>

<script>
// TEMP probe: ?camtrade opens the trade panel and sets a sample offer.
if (location.search.indexOf('camtrade') >= 0) {
  addEventListener('load', () => setTimeout(() => {
    // Finish the setup (Roll doubles as skip-ahead), wait for the human's
    // build phase, then open the panel and set a sample offer.
    document.getElementById('btn-roll').click();
    const tryOpen = (tries) => {
      const b = document.getElementById('btn-trade');
      if (b && !b.disabled) {
        b.click();
      } else {
        const roll = document.getElementById('btn-roll');
        if (roll && !roll.disabled) roll.click();  // setup skip / dice roll
      }
      if (b && !b.disabled) {
        setTimeout(() => {
          const chips = document.querySelectorAll('#trade-give .res, #trade-want .res');
          chips[0].click(); chips[0].click();
          chips[5 + 4].click();
        }, 150);
      } else if (tries > 0) {
        setTimeout(() => tryOpen(tries - 1), 150);
      }
    };
    setTimeout(() => tryOpen(60), 200);
  }, 600));
}
</script>
<script src="js/hex.js"></script>
<script src="js/i18n.js"></script>
<script src="js/map.js"></script>
<script src="js/state.js"></script>
<script src="js/graph.js"></script>
<script src="js/rules.js"></script>
<script src="js/render.js"></script>
<script src="js/ai.js"></script>
<script src="js/audio.js"></script>
<script src="js/art.js"></script>
<script src="js/main.js"></script>
</body>
</html>
