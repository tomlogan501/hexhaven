<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <!-- ============ RESOURCE HEXES (flat-top, 100px circumradius) ============ -->
  <symbol id="hex-forest" viewBox="-50 -50 100 100">
    <polygon points="0,-50 43.3,-25 43.3,25 0,50 -43.3,25 -43.3,-25"
      fill="#4a7c3a" stroke="#2c4a22" stroke-width="2"/>
    <polygon points="0,-50 43.3,-25 43.3,25 0,50 -43.3,25 -43.3,-25"
      fill="url(#sheen)" opacity=".25"/>
    <g fill="#2f5c26">
      <path d="M-14 10 L0 -28 L14 10 Z"/><rect x="-3" y="8" width="6" height="10" fill="#6b4a2a"/>
      <path d="M6 18 L18 -14 L30 18 Z"/><rect x="15" y="16" width="6" height="8" fill="#6b4a2a"/>
      <path d="M-30 20 L-17 -10 L-4 20 Z"/><rect x="-19" y="18" width="6" height="8" fill="#6b4a2a"/>
    </g>
  </symbol>

  <symbol id="hex-pasture" viewBox="-50 -50 100 100">
    <polygon points="0,-50 43.3,-25 43.3,25 0,50 -43.3,25 -43.3,-25"
      fill="#8fbc63" stroke="#5c7a3c" stroke-width="2"/>
    <g fill="#f2f0e6">
      <ellipse cx="0" cy="4" rx="13" ry="10"/>
      <circle cx="-14" cy="-6" r="7"/><circle cx="13" cy="-6" r="7"/>
      <circle cx="0" cy="-14" r="7.5"/>
      <rect x="-11" y="4" width="22" height="14" rx="7"/>
    </g>
    <circle cx="-6" cy="-6" r="1.6" fill="#333"/><circle cx="6" cy="-6" r="1.6" fill="#333"/>
    <circle cx="0" cy="-16" r="1.6" fill="#333"/>
  </symbol>

  <symbol id="hex-field" viewBox="-50 -50 100 100">
    <polygon points="0,-50 43.3,-25 43.3,25 0,50 -43.3,25 -43.3,-25"
      fill="#d9bd52" stroke="#9c8434" stroke-width="2"/>
    <g stroke="#a8863a" stroke-width="2.5" stroke-linecap="round">
      <path d="M-30 -6 L-30 16"/><path d="M-18 -8 L-18 18"/>
      <path d="M-6 -10 L-6 20"/><path d="M6 -10 L6 20"/>
      <path d="M18 -8 L18 18"/><path d="M30 -6 L30 16"/>
    </g>
    <g fill="#e8cf6a">
      <ellipse cx="-30" cy="-12" rx="5" ry="8"/><ellipse cx="-18" cy="-14" rx="5" ry="8"/>
      <ellipse cx="-6" cy="-16" rx="5" ry="8"/><ellipse cx="6" cy="-16" rx="5" ry="8"/>
      <ellipse cx="18" cy="-14" rx="5" ry="8"/><ellipse cx="30" cy="-12" rx="5" ry="8"/>
    </g>
  </symbol>

  <symbol id="hex-hill" viewBox="-50 -50 100 100">
    <polygon points="0,-50 43.3,-25 43.3,25 0,50 -43.3,25 -43.3,-25"
      fill="#b0784c" stroke="#7a4e2c" stroke-width="2"/>
    <g fill="#c98a5e">
      <rect x="-26" y="-4" width="16" height="11" rx="1.5"/>
      <rect x="-6" y="-8" width="16" height="11" rx="1.5"/>
      <rect x="12" y="-2" width="14" height="10" rx="1.5"/>
      <rect x="-16" y="12" width="16" height="10" rx="1.5"/>
      <rect x="4" y="14" width="14" height="9" rx="1.5"/>
    </g>
    <g stroke="#8d5c38" stroke-width="1" fill="none">
      <path d="M-26 -4 L-10 -4"/><path d="M-6 -8 L10 -8"/><path d="M12 -2 L26 -2"/>
    </g>
  </symbol>

  <symbol id="hex-mount" viewBox="-50 -50 100 100">
    <polygon points="0,-50 43.3,-25 43.3,25 0,50 -43.3,25 -43.3,-25"
      fill="#8a8a94" stroke="#5c5c66" stroke-width="2"/>
    <g fill="#6f6f7a">
      <path d="M-32 18 L-14 -14 L4 18 Z"/><path d="M2 18 L20 -6 L36 18 Z"/>
    </g>
    <g fill="#b8b8c2">
      <path d="M-14 -14 L-6 2 L-22 2 Z"/><path d="M20 -6 L26 6 L14 6 Z"/>
    </g>
    <ellipse cx="8" cy="24" rx="34" ry="7" fill="#5f5f6a" opacity=".5"/>
  </symbol>

  <symbol id="hex-desert" viewBox="-50 -50 100 100">
    <polygon points="0,-50 43.3,-25 43.3,25 0,50 -43.3,25 -43.3,-25"
      fill="#ded0a4" stroke="#a89b6e" stroke-width="2"/>
    <g fill="#c4b482" opacity=".7">
      <path d="M-28 14 q8 -10 16 0 q8 -10 16 0" stroke="#c4b482" stroke-width="3" fill="none"/>
      <path d="M-10 -8 q8 -10 16 0 q8 -10 16 0" stroke="#c4b482" stroke-width="3" fill="none"/>
    </g>
    <circle cx="16" cy="16" r="3" fill="#bfae7a"/>
    <circle cx="-20" cy="-4" r="2.5" fill="#bfae7a"/>
  </symbol>

  <!-- ============ ROBBER ============ -->
  <symbol id="robber" viewBox="-20 -28 40 56">
    <ellipse cx="0" cy="24" rx="13" ry="4" fill="#000" opacity=".3"/>
    <path d="M-11 22 q-4 -18 2 -26 q6 -8 12 0 q6 8 2 26 Z" fill="#2b2b33"/>
    <circle cx="0" cy="-8" r="7" fill="#3a3a45"/>
    <path d="M-7 -13 q7 -6 14 0 q-7 -3 -14 0" fill="#1a1a20"/>
    <circle cx="-2.5" cy="-9" r="1.4" fill="#e8e8ee"/>
    <circle cx="2.5" cy="-9" r="1.4" fill="#e8e8ee"/>
    <path d="M-11 10 q11 6 22 0" stroke="#6a6a75" stroke-width="1.5" fill="none"/>
  </symbol>

  <!-- ============ SETTLEMENT (small house) ============ -->
  <symbol id="settlement" viewBox="-22 -34 44 44">
    <ellipse cx="0" cy="8" rx="13" ry="4" fill="#000" opacity=".28"/>
    <polygon points="-12,8 -12,-10 0,-16 12,-10 12,8 0,13"
      fill="currentColor"/>
    <polygon points="0,13 12,8 12,-10 0,-5" fill="#000" opacity=".22"/>
    <polygon points="-15,-10 0,-22 15,-10 0,2" fill="#fff" opacity=".82"/>
    <polygon points="-15,-10 0,2 0,-5 0,-16" fill="#000" opacity=".15"/>
    <rect x="2" y="-20" width="3.5" height="7" fill="#8a8a94"/>
  </symbol>

  <!-- ============ CITY (twin-roof keep) ============ -->
  <symbol id="city" viewBox="-30 -46 60 56">
    <ellipse cx="0" cy="8" rx="18" ry="5" fill="#000" opacity=".3"/>
    <polygon points="-17,8 -17,-18 0,-25 17,-18 17,8 0,14" fill="currentColor"/>
    <polygon points="0,14 17,8 17,-18 0,-11" fill="#000" opacity=".24"/>
    <!-- tower -->
    <polygon points="-9,-18 -9,-34 0,-39 9,-34 9,-18 0,-14" fill="currentColor"/>
    <polygon points="0,-14 9,-18 9,-34 0,-30" fill="#000" opacity=".28"/>
    <!-- roof -->
    <polygon points="-20,-18 0,-34 20,-18 0,-6" fill="#fff" opacity=".88"/>
    <!-- tower roof -->
    <polygon points="-12,-34 0,-45 12,-34 0,-25" fill="#fff" opacity=".95"/>
    <!-- windows -->
    <g fill="#ffe9a8">
      <rect x="-12" y="-4" width="4" height="5"/><rect x="-4" y="-2" width="4" height="5"/>
      <rect x="4" y="-4" width="4" height="5"/><rect x="11" y="-6" width="4" height="5"/>
      <rect x="-6" y="-28" width="4" height="5"/>
    </g>
  </symbol>

  <!-- ============ HARBOR ============ -->
  <symbol id="harbor" viewBox="-30 -16 60 32">
    <rect x="-27" y="-13" width="54" height="26" rx="7"
      fill="#1d4266" stroke="#5ba3d5" stroke-width="2"/>
    <path d="M-18 6 q4 -8 8 0 q4 -8 8 0" stroke="#5ba3d5" stroke-width="2"
      fill="none" stroke-linecap="round"/>
    <text x="10" y="5" font-family="Trebuchet MS, sans-serif" font-size="12"
      fill="#a8d8ff" text-anchor="middle">3:1</text>
  </symbol>

  <symbol id="harbor2" viewBox="-30 -16 60 32">
    <rect x="-27" y="-13" width="54" height="26" rx="7"
      fill="#1d4266" stroke="#5ba3d5" stroke-width="2"/>
    <text x="-8" y="5" font-family="Trebuchet MS, sans-serif" font-size="15"
      fill="#a8d8ff" text-anchor="middle">⚓</text>
    <text x="12" y="5" font-family="Trebuchet MS, sans-serif" font-size="12"
      fill="#a8d8ff" text-anchor="middle">2:1</text>
  </symbol>

  <!-- ============ DEV CARDS ============ -->
  <symbol id="dev-knight" viewBox="0 0 90 128">
    <rect x="2" y="2" width="86" height="124" rx="8" fill="#2f4a7a" stroke="#d9c48a" stroke-width="2.5"/>
    <g transform="translate(45,58)">
      <path d="M0 -30 L18 -6 L4 2 L10 26 L0 18 L-10 26 L-4 2 L-18 -6 Z" fill="#e8e8f0"/>
      <circle cx="0" cy="-8" r="7" fill="#c8c8d8"/>
    </g>
    <text x="45" y="104" font-family="Trebuchet MS, sans-serif" font-size="11"
      fill="#d9c48a" text-anchor="middle">KNIGHT</text>
  </symbol>

  <symbol id="dev-victory" viewBox="0 0 90 128">
    <rect x="2" y="2" width="86" height="124" rx="8" fill="#7a3a3a" stroke="#d9c48a" stroke-width="2.5"/>
    <path d="M45 22 L54 40 L74 40 L58 52 L64 72 L45 60 L26 72 L32 52 L16 40 L36 40 Z"
      fill="#f0d878"/>
    <text x="45" y="104" font-family="Trebuchet MS, sans-serif" font-size="11"
      fill="#f0d878" text-anchor="middle">VICTORY +1</text>
  </symbol>

  <symbol id="dev-road" viewBox="0 0 90 128">
    <rect x="2" y="2" width="86" height="124" rx="8" fill="#3a5a3a" stroke="#d9c48a" stroke-width="2.5"/>
    <g stroke="#e8d8a0" stroke-width="7" stroke-linecap="round">
      <path d="M22 76 L38 48 L52 62 L68 34"/>
    </g>
    <circle cx="22" cy="76" r="5" fill="#fff"/><circle cx="68" cy="34" r="5" fill="#fff"/>
    <text x="45" y="104" font-family="Trebuchet MS, sans-serif" font-size="10"
      fill="#d9c48a" text-anchor="middle">ROAD BUILDING</text>
  </symbol>

  <symbol id="dev-year" viewBox="0 0 90 128">
    <rect x="2" y="2" width="86" height="124" rx="8" fill="#7a6a2a" stroke="#d9c48a" stroke-width="2.5"/>
    <g fill="#f0d878">
      <rect x="24" y="30" width="16" height="22" rx="3"/>
      <rect x="50" y="30" width="16" height="22" rx="3"/>
      <rect x="24" y="58" width="16" height="22" rx="3"/>
      <rect x="50" y="58" width="16" height="22" rx="3"/>
    </g>
    <text x="45" y="104" font-family="Trebuchet MS, sans-serif" font-size="10"
      fill="#f0d878" text-anchor="middle">YEAR OF PLENTY</text>
  </symbol>

  <symbol id="dev-monopoly" viewBox="0 0 90 128">
    <rect x="2" y="2" width="86" height="124" rx="8" fill="#5a2a5a" stroke="#d9c48a" stroke-width="2.5"/>
    <g fill="#e8c8f0">
      <circle cx="45" cy="52" r="24"/>
      <text x="45" y="60" font-family="Trebuchet MS, sans-serif" font-size="22"
        fill="#5a2a5a" text-anchor="middle">$</text>
    </g>
    <text x="45" y="104" font-family="Trebuchet MS, sans-serif" font-size="10"
      fill="#e8c8f0" text-anchor="middle">MONOPOLY</text>
  </symbol>

  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity=".7"/>
      <stop offset="60%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>